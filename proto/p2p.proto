syntax = "proto3";

package p2p;

option go_package = "github.com/darshan/p2p-fileshare/proto";

// ============================================================
// BOOTSTRAP SERVICE
// Central registry for peer discovery
// ============================================================

service BootstrapService {
  // Register a new peer and receive a list of known peers
  rpc RegisterPeer(RegisterRequest) returns (RegisterResponse);
  // Get a list of active peers
  rpc GetPeers(GetPeersRequest) returns (GetPeersResponse);
}

// ============================================================
// PEER SERVICE
// Peer-to-peer communication
// ============================================================

service PeerService {
  // Ping for latency measurement
  rpc Ping(PingRequest) returns (PingResponse);
  // Get the peer's view of the network graph
  rpc GetNetworkGraph(GraphRequest) returns (GraphResponse);
  // Notify peer about a new peer joining the network
  rpc NotifyNewPeer(NewPeerNotification) returns (NotifyResponse);
  // Calculate the shortest route between two peers using Dijkstra
  rpc CalculateRoute(RouteRequest) returns (RouteResponse);
  // Get all currently cached routes
  rpc GetRouteCache(GetCacheRequest) returns (GetCacheResponse);
  // Invalidate (clear) the entire route cache
  rpc InvalidateRouteCache(InvalidateCacheRequest) returns (InvalidateCacheResponse);
}

// ============================================================
// ROUTING MESSAGES (Day 2)
// ============================================================

// Request to calculate the shortest route between two peers.
message RouteRequest {
  int32 from_peer_id = 1;
  int32 to_peer_id = 2;
}

// Response containing the calculated shortest route.
message RouteResponse {
  repeated int32 path = 1;       // Ordered sequence of peer IDs, e.g. [1, 3, 7, 10]
  int64 total_latency_ms = 2;    // Sum of edge latencies along the path
  int32 hops = 3;                // Number of hops (len(path) - 1)
}

// A single cached route entry.
message RouteCacheEntry {
  int32 from_peer_id = 1;
  int32 to_peer_id = 2;
  repeated int32 path = 3;
  int64 total_latency_ms = 4;
  int32 hops = 5;
  int64 cached_at = 6;          // Unix timestamp
  int32 ttl_seconds = 7;
}

// Request to retrieve the route cache.
message GetCacheRequest {
  int32 requester_id = 1;
}

// Response containing all cached route entries.
message GetCacheResponse {
  repeated RouteCacheEntry entries = 1;
}

// Request to invalidate (clear) the route cache.
message InvalidateCacheRequest {}

// Response confirming cache invalidation.
message InvalidateCacheResponse {
  bool success = 1;
  int32 entries_cleared = 2;
}

// ============================================================
// COMMON MESSAGES
// ============================================================

// Information about a peer in the network
message PeerInfo {
  int32 peer_id = 1;
  string address = 2;
  int64 last_seen = 3; // Unix timestamp
}

// ============================================================
// BOOTSTRAP MESSAGES
// ============================================================

// Request to register a peer with the bootstrap server
message RegisterRequest {
  int32 peer_id = 1;
  string address = 2;
}

// Response from bootstrap after registration
message RegisterResponse {
  bool success = 1;
  repeated PeerInfo peers = 2; // List of known peers to connect to
}

// Request to get list of active peers
message GetPeersRequest {
  int32 limit = 1; // Max number of peers to return
}

// Response with list of active peers
message GetPeersResponse {
  repeated PeerInfo peers = 1;
}

// ============================================================
// PEER MESSAGES
// ============================================================

// Ping request for latency measurement
message PingRequest {
  int32 sender_id = 1;
  int64 timestamp = 2; // Unix nano timestamp when ping was sent
}

// Ping response
message PingResponse {
  int32 responder_id = 1;
  int64 timestamp = 2; // Unix nano timestamp when pong was sent
}

// Request to get network graph from a peer
message GraphRequest {
  int32 requester_id = 1;
}

// Network graph response
message GraphResponse {
  repeated NetworkNode nodes = 1;
  repeated NetworkEdge edges = 2;
}

// A node in the network graph
message NetworkNode {
  int32 id = 1;
  string address = 2;
  int64 last_seen = 3; // Unix timestamp
}

// An edge in the network graph (connection between peers)
message NetworkEdge {
  int32 from_id = 1;
  int32 to_id = 2;
  int64 latency_ms = 3; // Measured round-trip latency in milliseconds
}

// Notification about a new peer joining the network
message NewPeerNotification {
  int32 peer_id = 1;
  string address = 2;
}

// Response to a new peer notification
message NotifyResponse {
  bool acknowledged = 1;
}
